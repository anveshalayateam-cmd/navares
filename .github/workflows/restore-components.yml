name: Restore component sources
on:
  push:
    paths:
      - '.restore/**'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and restore TSX sources
        run: |
          python3 << 'EOF'
          import base64, zlib, pathlib, json
          root = pathlib.Path('.restore')
          meta = json.loads((root / 'manifest.json').read_text())
          def load(prefix, n):
              data = ''.join((root / f'{prefix}.{i}.b64').read_text().strip() for i in range(n))
              return zlib.decompress(base64.b64decode(data))
          pathlib.Path('src/components/InfoMenu.tsx').write_bytes(load('infomenu', meta['infomenu']))
          pathlib.Path('src/components/MarsGlobe.tsx').write_bytes(load('marsglobe', meta['marsglobe']))
          print('restored OK')
          EOF
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/components/InfoMenu.tsx src/components/MarsGlobe.tsx
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Restore InfoMenu.tsx and MarsGlobe.tsx (clouds always on, colors, loading, Grok)"
          git push
