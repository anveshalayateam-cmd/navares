name: Apply Extra Details CTX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Extra Details patches
        run: python3 scripts/apply_extra_details.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/MarsGlobe.tsx src/components/InfoMenu.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "feat: Extra Details (Murray Lab CTX) across all map modes; MOLA-locked footer elev"
            git push
          fi
