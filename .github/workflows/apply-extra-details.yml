name: Apply Extra Details CTX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore full InfoMenu + CTX attribution
        run: python3 scripts/restore_infomenu_full.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/InfoMenu.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "fix: restore full InfoMenu.tsx with High-Resolution Orbital Detail attribution"
            git push
          fi
