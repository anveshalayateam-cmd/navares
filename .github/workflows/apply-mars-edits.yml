name: Apply Mars Edits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply moon integration
        run: python3 scripts/add_mars_moons.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Phobos & Deimos: NASA glTF models, JPL Horizons orbits, attribution"
            git push
          fi
