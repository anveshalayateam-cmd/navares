name: Apply Mars Edits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add moon targets + select/zoom
        run: python3 scripts/add_moon_targets.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Phobos & Deimos: search, info cards, select & zoom like other orbiters"
            git push
          fi
