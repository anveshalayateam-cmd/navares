name: Apply Mars Edits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        run: |
          python3 scripts/apply_zoom_color_clouds.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/MarsGlobe.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Min 10s loading; altitude sandy color blend; clouds fade on zoom-in"
            git push
          fi
