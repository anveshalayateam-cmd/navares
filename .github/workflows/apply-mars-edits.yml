name: Apply Mars Edits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add moon orbit lines
        run: python3 scripts/add_moon_orbit_lines.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/MarsGlobe.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Faint glowing orbital paths for Phobos and Deimos"
            git push
          fi
