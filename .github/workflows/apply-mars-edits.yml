name: Apply Mars Edits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patches
        run: |
          python3 scripts/apply_mars_edits.py || true
          python3 scripts/hide_hud_until_ready.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/MarsGlobe.tsx src/components/InfoMenu.tsx src/App.tsx
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Hide HUD while globe loads; credit loading Mars image"
            git push
          fi
